<mat-toolbar class="topbar">
  <button mat-icon-button class="menu-btn" (click)="menuToggle.emit()" aria-label="Menú">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="brand">
     <img src="../../../../assets/images/01-BLC_POWER_POSITIVO.png" width="20%" height="20%">    
    <span class="brand-name">Indisponibilidad</span>
  </div>

  <span class="spacer"></span>

  <div class="topbar-actions">
    <div class="topbar-chip">
      <span class="chip-dot"></span>
      <span>Sistema activo</span>
    </div>

    @if (auth.currentUser(); as user) {
      <div class="user-info">
        <mat-icon class="user-icon">account_circle</mat-icon>
        <span class="user-name">{{ user.display_name }}</span>
      </div>

      <button
        class="theme-btn"
        (click)="theme.toggle()"
        [matTooltip]="theme.isDark() ? 'Modo Claro' : 'Modo Oscuro'"
      >
        <span class="theme-icon-wrap" [class.is-dark]="theme.isDark()">
          @if (theme.isDark()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="theme-svg">
              <circle cx="12" cy="12" r="4" fill="currentColor" opacity=".25"/>
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2"/>
              <path d="M12 20v2"/>
              <path d="M4.93 4.93l1.41 1.41"/>
              <path d="M17.66 17.66l1.41 1.41"/>
              <path d="M2 12h2"/>
              <path d="M20 12h2"/>
              <path d="M4.93 19.07l1.41-1.41"/>
              <path d="M17.66 6.34l1.41-1.41"/>
              <circle cx="12" cy="12" r="7" stroke-opacity=".12" stroke-dasharray="2 3"/>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="theme-svg">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          }
        </span>
      </button>

      <button
        mat-icon-button
        class="action-btn"
        aria-label="Cerrar sesión"
        matTooltip="Cerrar sesión"
        (click)="auth.logout()"
      >
        <mat-icon>logout</mat-icon>
      </button>
    }
  </div>
</mat-toolbar>
